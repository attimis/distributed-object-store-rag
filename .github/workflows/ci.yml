name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb  # v6.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Lint (dead code, unused imports and arguments)
        run: uv run ruff check .

      - name: Fast tests (no model downloads)
        run: uv run pytest -q -m "not models"

      - name: Leak guard and link checker
        run: uv run pytest -q tests/test_no_internal_refs.py tests/test_docs_links.py
